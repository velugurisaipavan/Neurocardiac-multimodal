[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurocardiac-multimodal"
version = "0.1.0"
description = "Paper-aligned reconstruction of ECG-EEG-clinical-text attention fusion"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "torch>=2.6,<3", "transformers>=4.40,<5"]

[project.optional-dependencies]
dev = ["pytest>=7,<10"]
ica = ["mne>=1.6,<2"]

[tool.setuptools.packages.find]
include = ["neurocardiac*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
